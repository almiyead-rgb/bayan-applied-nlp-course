name: Revision source snapshot
on:
  push:
    branches: [revision/bayan-project-guide-20260924]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/bayan-source-current.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bayan-source-current
          path: /tmp/bayan-source-current.zip
          retention-days: 1
