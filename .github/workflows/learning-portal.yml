name: Bayan learning portal

on:
  push:
    branches: [main]
    paths-ignore: ['docs/index.html', 'portal/acceptance-report.json', 'portal/source-manifest.json']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bayan-learning-portal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preserve original scientific content
        run: |
          python - <<'PY'
          import subprocess
          protected=['notebooks','data','src','tests',':(glob)requirements*.txt']
          changed=subprocess.check_output(['git','diff','--name-only','ee7c7d8bf3a17c9989b37a3fdd337f3fc3730d7e','--',*protected],text=True).strip()
          assert not changed,'Scientific content changed: '+changed
          print('SCIENTIFIC_CONTENT_PRESERVED=PASS')
          PY
      - name: Validate the existing course release gate and preflight helper
        run: |
          python -m pip install numpy pytest
          PYTHONPATH=src python -m pytest -q tests tools/test_preflight.py
          python scripts/validate_course.py
          python scripts/build_student_starter.py
          git diff --exit-code -- student-starter downloads
      - name: Install portal build and browser test dependencies
        run: |
          python -m pip install -r portal/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build and test the learner portal
        run: |
          node --check portal/app.js
          python tools/build_learning_portal.py
          python tools/test_learning_portal.py
      - name: Store verified compiled site and audit reports
        run: |
          cp _site/index.html docs/index.html
          cp _site/acceptance-report.json portal/acceptance-report.json
          cp _site/source-manifest.json portal/source-manifest.json
          git add docs/index.html portal/acceptance-report.json portal/source-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(portal): refresh verified learner site and audit reports'
            git push origin HEAD:main
          fi
      - name: Check actual GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > "$RUNNER_TEMP/bayan-pages.json" 2> "$RUNNER_TEMP/bayan-pages-error.txt"; then
            KIND=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("build_type",""))' "$RUNNER_TEMP/bayan-pages.json")
            echo "PAGES_SOURCE=$KIND"
            if [ "$KIND" = 'workflow' ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo '{"ready_for_deployment":true,"source":"workflow","live_site_verified":false}' > _site/deployment-readiness.json
              echo 'Build and browser acceptance passed. Pages is configured for Actions; deployment follows.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo '{"ready_for_deployment":false,"reason":"Select GitHub Actions as the Pages source","live_site_verified":false}' > _site/deployment-readiness.json
              echo 'Build passed. Select Settings > Pages > Source > GitHub Actions, then run this workflow to publish.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'PAGES_SOURCE=unavailable'
            cat "$RUNNER_TEMP/bayan-pages-error.txt"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '{"ready_for_deployment":false,"reason":"Pages configuration unavailable; owner activation required","live_site_verified":false}' > _site/deployment-readiness.json
            echo 'Build and browser acceptance passed. Pages is unavailable through this workflow token. An owner must enable Settings > Pages > Source > GitHub Actions, then run this workflow. No live-site claim is made.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bayan-learning-portal
          path: _site/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
