name: Bayan learning portal

on:
  push:
    branches: [main]
    paths-ignore: ['docs/index.html', 'portal/acceptance-report.json', 'portal/source-manifest.json', 'portal/video-link-check.json', 'portal/video-acceptance.json']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bayan-learning-portal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate topic-matched declarative YouTube companions
        run: |
          python tools/build_video_companions.py --sources
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          paths=json.loads(pathlib.Path('portal/video-source-report.json').read_text())['paths']
          before={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          subprocess.run(['python','tools/build_video_companions.py','--sources'],check=True)
          assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for p,h in before.items())
          print('VIDEO_GENERATION_IDEMPOTENCE=PASS')
          PY
      - name: Preserve original scientific implementation and existing frontend
        run: |
          python - <<'PY'
          import subprocess
          protected=['notebooks','data','src','tests',':(glob)requirements*.txt']
          changed=subprocess.check_output(['git','diff','--name-only','ee7c7d8bf3a17c9989b37a3fdd337f3fc3730d7e','--',*protected],text=True).strip()
          assert not changed,'Scientific implementation changed: '+changed
          print('SCIENTIFIC_CONTENT_PRESERVED=PASS')
          PY
      - name: Validate course and student starter
        run: |
          python -m pip install numpy pytest
          PYTHONPATH=src python -m pytest -q tests tools/test_preflight.py
          python scripts/validate_course.py
          python scripts/build_student_starter.py
          git diff --exit-code -- student-starter downloads
      - name: Install portal build and browser test dependencies
        run: |
          python -m pip install -r portal/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build and test the original portal and video companions
        run: |
          node --check portal/app.js
          python tools/build_learning_portal.py
          python tools/build_video_companions.py --navigation _site/index.html
          python tools/test_learning_portal.py
          python tools/test_portal_content_contract.py _site/index.html --report _site/content-contract.json
          python tools/test_video_companions.py
      - name: Check public YouTube identifier and title metadata
        run: python tools/check_video_links.py --out _site/video-link-check.json
      - name: Store verified guides, site and audit reports
        run: |
          cp _site/index.html docs/index.html
          cp _site/acceptance-report.json portal/acceptance-report.json
          cp _site/source-manifest.json portal/source-manifest.json
          cp _site/content-contract.json portal/content-contract.json
          cp _site/video-acceptance.json portal/video-acceptance.json
          cp _site/video-link-check.json portal/video-link-check.json
          python - <<'PY'
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('portal/video-source-report.json').read_text())['paths']
          assert all(p.endswith('.md') and not pathlib.Path(p).is_absolute() and '..' not in pathlib.Path(p).parts for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git add docs/index.html portal/acceptance-report.json portal/source-manifest.json portal/content-contract.json portal/video-source-report.json portal/video-acceptance.json portal/video-link-check.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(videos): publish topic-matched YouTube guides and verified course navigation'
            git push origin HEAD:main
          fi
      - name: Check actual GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > "$RUNNER_TEMP/bayan-pages.json" 2> "$RUNNER_TEMP/bayan-pages-error.txt"; then
            KIND=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("build_type",""))' "$RUNNER_TEMP/bayan-pages.json")
            echo "PAGES_SOURCE=$KIND"
            if [ "$KIND" = 'workflow' ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo '{"ready_for_deployment":true,"source":"workflow","live_site_verified":false}' > _site/deployment-readiness.json
            else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo '{"ready_for_deployment":false,"reason":"Select GitHub Actions as Pages source","live_site_verified":false}' > _site/deployment-readiness.json
            fi
          else
            cat "$RUNNER_TEMP/bayan-pages-error.txt"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '{"ready_for_deployment":false,"reason":"Pages unavailable; owner activation required","live_site_verified":false}' > _site/deployment-readiness.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayan-learning-portal
          path: _site/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
