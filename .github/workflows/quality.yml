name: Quality checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  course-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Run course unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests

      - name: Validate public materials and saved notebook evidence
        run: python scripts/validate_course.py

      - name: Verify student starter is reproducible
        run: |
          python scripts/build_student_starter.py
          git diff --exit-code -- student-starter downloads
